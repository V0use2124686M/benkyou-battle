<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>べんきょうバトル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #2b1b5e 0%, #4a2c8f 60%, #6a3fb5 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    min-height: 100%;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh; /* スマホのアドレスバーぶんを除いた高さに収める */
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    position: relative;
    overflow: hidden;
  }

  /* ===== タイトルがめん ===== */
  #titleScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: center;
    overflow-y: auto;
    padding: 6px 0;
  }
  .gameTitle {
    font-size: 32px;
    font-weight: bold;
    line-height: 1.25;
    text-shadow: 3px 3px 0 #1a0f3d, -1px -1px 0 #ff69b4;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .titleMonsters { font-size: 32px; letter-spacing: 4px; }
  .modeBtn {
    width: 100%;
    padding: 10px 12px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    border: 4px solid #fff;
    border-radius: 16px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    transition: transform .1s;
  }
  .modeBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  #btnMul { background: linear-gradient(180deg, #ff8a5c, #f4511e); }
  #btnDiv { background: linear-gradient(180deg, #5cc9ff, #1e88e5); }
  #btnKanji { background: linear-gradient(180deg, #7ee081, #2e9e46); }
  #btnGeo { background: linear-gradient(180deg, #4dd0e1, #00838f); }
  #btnEn { background: linear-gradient(180deg, #ffb74d, #ef6c00); }
  #btnHist { background: linear-gradient(180deg, #e57373, #b71c1c); }
  .modeBtn small { display: block; font-size: 11px; font-weight: normal; margin-top: 2px; opacity: .95; }
  .bestScore { font-size: 12px; color: #ffe082; margin-top: 2px; }
  #btnResetScore {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    background: rgba(255,255,255,.15);
    border: 2px solid rgba(255,255,255,.6);
    border-radius: 10px;
    padding: 6px 14px;
    cursor: pointer;
    margin-top: 2px;
  }
  #btnResetScore:active { transform: translateY(2px); }
  #btnResetScore.arm { background: #d32f2f; border-color: #fff; animation: comboPop .3s; }

  /* ===== ゲームがめん ===== */
  #gameScreen { flex: 1; display: none; flex-direction: column; gap: 6px; min-height: 0; }

  #topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    gap: 6px;
  }
  #btnQuit {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    background: rgba(255,255,255,.15);
    border: 2px solid #fff;
    border-radius: 10px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #btnQuit:active { transform: translateY(2px); }
  #comboLabel { color: #ffd54f; min-height: 22px; }
  #comboLabel.hot { animation: comboPop .3s; }
  @keyframes comboPop {
    0% { transform: scale(1.6); }
    100% { transform: scale(1); }
  }

  /* モンスター */
  #monsterArea {
    background: rgba(0,0,0,.25);
    border-radius: 18px;
    padding: 6px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #monsterName { font-size: 16px; font-weight: bold; flex-shrink: 0; }
  #monsterBox {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #monsterImg { max-height: 100%; max-width: 100%; object-fit: contain; display: none; }
  #monsterEmoji { font-size: 76px; line-height: 1; }
  #monsterBox.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-6deg); }
    40% { transform: translateX(10px) rotate(5deg); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(6px); }
  }
  #monsterBox.attack { animation: monAttack .45s; }
  @keyframes monAttack {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(26px) scale(1.25); }
  }
  #monsterBox.defeated { animation: defeat .7s forwards; }
  @keyframes defeat {
    0% { transform: rotate(0) scale(1); opacity: 1; }
    100% { transform: rotate(360deg) scale(0); opacity: 0; }
  }
  #monsterBox.appear { animation: appear .5s; }
  @keyframes appear {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .hpBarOuter {
    background: rgba(0,0,0,.5);
    border: 2px solid #fff;
    border-radius: 10px;
    height: 14px;
    overflow: hidden;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .hpBarInner {
    height: 100%;
    border-radius: 6px;
    transition: width .4s;
  }
  #monsterHpBar { background: linear-gradient(90deg, #ff5252, #ff1744); width: 100%; }
  #playerHpBar { background: linear-gradient(90deg, #69f0ae, #00c853); width: 100%; }
  .dmgPop {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translateX(-50%);
    font-size: 34px;
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 2px 2px 0 #b71c1c;
    pointer-events: none;
    animation: dmgFloat .8s forwards;
    z-index: 5;
  }
  @keyframes dmgFloat {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1.4); }
    100% { opacity: 0; transform: translate(-50%, -55px) scale(1); }
  }

  /* プレイヤー */
  #playerArea {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,.25);
    border-radius: 14px;
    padding: 5px 12px;
  }
  #playerFace { font-size: 28px; }
  #playerArea.hurt { animation: hurtFlash .5s; }
  @keyframes hurtFlash {
    0%, 100% { background: rgba(0,0,0,.25); }
    30% { background: rgba(255,0,0,.55); transform: translateX(-6px); }
    60% { transform: translateX(6px); }
  }
  #playerHpWrap { flex: 1; }
  #playerHpText { font-size: 13px; font-weight: bold; }

  /* もんだい */
  #questionArea {
    background: #fffde7;
    color: #333;
    border-radius: 18px;
    padding: 8px;
    text-align: center;
    min-height: 78px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  #questionLabel { font-size: 14px; color: #7b5e00; font-weight: bold; }
  #questionMain { font-size: 38px; font-weight: bold; line-height: 1.2; }
  #questionMain.kanjiBig { font-size: 52px; }
  #questionMain.textQ { font-size: 16px; line-height: 1.45; text-align: left; padding: 2px 4px; }
  #questionMain.symbolQ { display: flex; align-items: center; justify-content: center; }
  .symSvg { width: 92px; height: 92px; }
  .symGlyph { font-size: 64px; line-height: 1; }
  /* えいたんご + カタカナフリガナ */
  #questionMain.enQ { display: flex; align-items: center; justify-content: center; }
  .enWord { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
  #questionMain .enMain { font-size: 40px; font-weight: bold; }
  #questionMain .enKana { font-size: 16px; color: #9c6f00; margin-top: 3px; font-weight: bold; }
  .choiceBtn .enWord .enMain { font-size: 21px; }
  .choiceBtn .enWord .enMainJa { font-size: 18px; }
  .choiceBtn .enWord .enKana { font-size: 10px; opacity: .92; font-weight: normal; margin-top: 1px; }
  /* こたえる まえは よみの 場所だけ とって かくす (レイアウトを うごかさない) */
  .choiceBtn.hideReading .enKana { visibility: hidden; }
  /* ふりがな (ルビ) */
  ruby { ruby-align: center; }
  rt { font-weight: normal; user-select: none; }
  #questionMain rt { font-size: 40%; color: #7b5e00; }
  /* ヒントの文しょうは ルビの ぶんだけ 行間を ひろげる */
  #questionMain.rubyBlock { line-height: 2.1; }
  #questionMain.rubyBlock rt { font-size: 62%; }
  .choiceBtn rt { font-size: 42%; opacity: .95; }
  /* 「なまえ(ばしょ)」の せんたくしは ながいので 1れつに ならべる */
  #choices.oneCol { grid-template-columns: 1fr; gap: 6px; }
  #choices.oneCol .choiceBtn { font-size: 19px; min-height: 46px; padding: 6px 10px; }
  .placeTag { font-size: 14px; margin-left: 2px; }
  .placeTag rt { font-size: 55%; }

  /* メッセージ */
  #message {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    min-height: 24px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.5);
  }
  #message.good { color: #ffee58; animation: comboPop .3s; }
  #message.bad { color: #ff8a80; }

  /* こたえボタン */
  #choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-bottom: 2px;
  }
  .choiceBtn {
    padding: 12px 6px;
    font-size: 24px;
    font-weight: bold;
    font-family: inherit;
    border: 4px solid #fff;
    border-radius: 16px;
    background: linear-gradient(180deg, #ba8bfa, #7c4dff);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    transition: transform .1s;
    min-height: 56px;
  }
  .choiceBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .choiceBtn:disabled { opacity: .85; }
  .choiceBtn.correct { background: linear-gradient(180deg, #66bb6a, #2e7d32); animation: comboPop .3s; }
  .choiceBtn.wrong { background: linear-gradient(180deg, #ef5350, #b71c1c); }

  /* ゲームオーバー */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 5, 30, .88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    border-radius: 12px;
    z-index: 20;
    padding: 20px;
  }
  #overlay .bigFace { font-size: 70px; }
  #overlay h2 { font-size: 34px; color: #ff8a80; text-shadow: 2px 2px 0 #000; }
  #overlay .resultLine { font-size: 20px; }
  #overlay .resultLine b { color: #ffd54f; font-size: 26px; }
  #newRecord { color: #ffee58; font-size: 20px; font-weight: bold; display: none; animation: titleBounce 1s infinite; }
  .ovBtn {
    width: 80%;
    padding: 16px;
    font-size: 22px;
    font-weight: bold;
    font-family: inherit;
    border: 4px solid #fff;
    border-radius: 16px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  .ovBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  #btnRetry { background: linear-gradient(180deg, #ff8a5c, #f4511e); }
  #btnToTitle { background: linear-gradient(180deg, #5cc9ff, #1e88e5); }

  /* かちどき (たおしたあとの モンスターエリアに かさねて だす) */
  #winBanner {
    position: absolute;
    left: 0; right: 0; top: 32px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #ffee58;
    text-shadow: 3px 3px 0 #e65100;
    pointer-events: none;
    display: none;
    z-index: 10;
    animation: comboPop .4s;
  }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <div id="titleScreen">
    <div class="titleMonsters">👾🐲👻</div>
    <div class="gameTitle">べんきょう<br>バトル</div>
    <div style="font-size:13px;">もんだいに こたえて モンスターを たおそう!</div>
    <button class="modeBtn" id="btnMul">✖ かけ算モード<small>九九で たたかう!</small><span class="bestScore" id="bestMul"></span></button>
    <button class="modeBtn" id="btnDiv">➗ わり算モード<small>わり算で たたかう!</small><span class="bestScore" id="bestDiv"></span></button>
    <button class="modeBtn" id="btnKanji">📖 かんじモード<small>かんじの よみかたで たたかう!</small><span class="bestScore" id="bestKanji"></span></button>
    <button class="modeBtn" id="btnHist">🏯 にほんしモード<small>人ぶつと 年号で たたかう!</small><span class="bestScore" id="bestHist"></span></button>
    <button class="modeBtn" id="btnGeo">🗾 ちりモード<small>とどうふけんと けんちょうしょざいちで たたかう!</small><span class="bestScore" id="bestGeo"></span></button>
    <button class="modeBtn" id="btnEn">🔤 えいごモード<small>えいたんごの いみで たたかう!</small><span class="bestScore" id="bestEn"></span></button>
    <button id="btnResetScore">🗑 スコアを リセット</button>
  </div>

  <!-- バトル -->
  <div id="gameScreen">
    <div id="topBar">
      <span id="scoreLabel">スコア 0</span>
      <span id="comboLabel"></span>
      <span id="levelLabel">レベル 1</span>
      <button id="btnQuit">やめる</button>
    </div>

    <div id="monsterArea">
      <div id="monsterName">モンスター</div>
      <div id="monsterBox">
        <img id="monsterImg" alt="">
        <div id="monsterEmoji">👾</div>
      </div>
      <div class="hpBarOuter"><div class="hpBarInner" id="monsterHpBar"></div></div>
      <div id="winBanner"></div>
    </div>

    <div id="playerArea">
      <span id="playerFace">🧒</span>
      <div id="playerHpWrap">
        <div id="playerHpText">きみの HP 100/100</div>
        <div class="hpBarOuter"><div class="hpBarInner" id="playerHpBar"></div></div>
      </div>
    </div>

    <div id="questionArea">
      <div id="questionLabel"></div>
      <div id="questionMain"></div>
    </div>

    <div id="message"></div>

    <div id="choices">
      <button class="choiceBtn"></button>
      <button class="choiceBtn"></button>
      <button class="choiceBtn"></button>
      <button class="choiceBtn"></button>
    </div>
  </div>

  <!-- けっか (ゲームオーバー / とちゅうしゅうりょう) -->
  <div id="overlay">
    <div class="bigFace" id="overlayFace">😵</div>
    <h2 id="overlayTitle">ゲームオーバー</h2>
    <div class="resultLine">スコア <b id="finalScore">0</b></div>
    <div class="resultLine">たおした かず <b id="finalKills">0</b></div>
    <div class="resultLine">さいこうコンボ <b id="finalCombo">0</b></div>
    <div id="newRecord">🎉 しんきろく! 🎉</div>
    <button class="ovBtn" id="btnRetry">もういちど</button>
    <button class="ovBtn" id="btnToTitle">モードをえらぶ</button>
  </div>

</div>

<script>
"use strict";

/* ==================== かんじデータ (小2・小3・小4) ====================
   [かんじ, せいかい, [まちがい1, まちがい2, まちがい3]]
   1〜3文字のことば。がくねんごとに 3つの配列に わけている。 */
var KANJI_G2 = [
  ["星","ほし",["つき","そら","くも"]],
  ["雪","ゆき",["あめ","くも","こおり"]],
  ["船","ふね",["くるま","はし","うみ"]],
  ["馬","うま",["うし","とり","しか"]],
  ["魚","さかな",["とり","むし","かい"]],
  ["鳥","とり",["むし","うま","さかな"]],
  ["池","いけ",["うみ","かわ","いし"]],
  ["海","うみ",["いけ","かわ","そら"]],
  ["岩","いわ",["いし","すな","やま"]],
  ["谷","たに",["やま","かわ","もり"]],
  ["野","の",["はら","もり","た"]],

  ["里","さと",["むら","まち","みち"]],

  ["黄","き",["あか","あお","くろ"]],
  ["黒","くろ",["しろ","あか","あお"]],
  ["声","こえ",["おと","うた","くち"]],
  ["音","おと",["こえ","みみ","うた"]],
  ["歌","うた",["こえ","おと","おどり"]],
  ["顔","かお",["あたま","くび","みみ"]],
  ["首","くび",["かお","あたま","かた"]],
  ["頭","あたま",["かお","くび","かみ"]],
  ["体","からだ",["あたま","こころ","ちから"]],
  ["心","こころ",["からだ","あたま","むね"]],
  ["力","ちから",["うで","こし","からだ"]],
  ["紙","かみ",["いと","ぬの","ふで"]],
  ["絵","え",["じ","いろ","かみ"]],
  ["字","じ",["え","ぶん","ほん"]],
  ["春","はる",["なつ","あき","ふゆ"]],
  ["夏","なつ",["はる","あき","ふゆ"]],
  ["秋","あき",["はる","なつ","ふゆ"]],
  ["冬","ふゆ",["はる","なつ","あき"]],
  ["朝","あさ",["ひる","よる","ゆう"]],
  ["昼","ひる",["あさ","よる","ばん"]],
  ["夜","よる",["あさ","ひる","ゆめ"]],
  ["雲","くも",["あめ","ゆき","かぜ"]],
  ["風","かぜ",["くも","あめ","そら"]],
  ["光","ひかり",["かげ","ほし","ひ"]],
  ["東","ひがし",["にし","みなみ","きた"]],
  ["西","にし",["ひがし","みなみ","きた"]],
  ["南","みなみ",["きた","ひがし","にし"]],
  ["北","きた",["みなみ","にし","ひがし"]],
  ["前","まえ",["うしろ","よこ","した"]],
  ["外","そと",["うち","なか","よこ"]],
  ["妹","いもうと",["おとうと","あね","あに"]],
  ["姉","あね",["いもうと","あに","おとうと"]],

  ["戸","と",["まど","かべ","もん"]],

  ["毛","け",["かみ","ひげ","はね"]],
  ["歯","は",["くち","した","くちびる"]],
  /* 小2までの かんじの じゅくご */
  ["天気","てんき",["でんき","くうき","てんし"]],
  ["電車","でんしゃ",["じてんしゃ","きしゃ","じどうしゃ"]],
  ["公園","こうえん",["がっこう","こうじょう","どうぶつえん"]],
  ["教室","きょうしつ",["きょうかい","しょくいんしつ","たいいくかん"]],
  ["時間","じかん",["じこく","とけい","ようび"]],
  ["会社","かいしゃ",["しゃかい","かいわ","じんじゃ"]],
  ["台風","たいふう",["かぜ","たいよう","かみなり"]],
  ["汽車","きしゃ",["でんしゃ","くるま","ふね"]],
  ["麦茶","むぎちゃ",["こうちゃ","こむぎ","みずちゃ"]],
  ["親子","おやこ",["きょうだい","かぞく","ふたご"]],
  ["星空","ほしぞら",["よぞら","あおぞら","ゆうやけ"]],
  ["番組","ばんぐみ",["ばんごう","ばんち","くみあい"]],
  ["図工","ずこう",["こうさく","さんすう","おんがく"]],
  ["朝顔","あさがお",["ひまわり","あさひ","ゆうがお"]]
];

/* 小3ちゅうしん */

function rubyHtml(text, kana) {
  if (!kana) return text;
  return "<ruby>" + text + "<rt>" + kana + "</rt></ruby>";
}
/* 文しょうの なかの かんじの ことばだけに ルビを ふる */
function rubyText(text) {
  return text.replace(RUBY_RE, function(m) {
    return "<ruby>" + m + "<rt>" + RUBY_DICT[m] + "</rt></ruby>";
  });
}

/* ==================== おと (Web Audio) ==================== */
var audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function beep(freq, start, dur, type, vol) {
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    var t = audioCtx.currentTime + start;
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

/* むずかしさ: 0 = レベル1〜6, 1 = レベル7〜8, 2 = レベル9〜 (さいこう難度) */
function difficulty() {
  if (state.monsterIndex >= 8) return 2;
  if (state.monsterIndex >= 6) return 1;
  return 0;
}

var $ = function(id) { return document.getElementById(id); };
var choiceBtns = Array.prototype.slice.call(document.querySelectorAll(".choiceBtn"));

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function rand(n) { return Math.floor(Math.random() * n); }

function getBest(mode) {
  try { return parseInt(localStorage.getItem(MODES[mode].storageKey) || "0", 10) || 0; }
  catch (e) { return 0; }
}
function setBest(mode, v) {
  try { localStorage.setItem(MODES[mode].storageKey, String(v)); } catch (e) {}
}

/* ==================== がめん ==================== */
function showTitle() {
  $("titleScreen").style.display = "flex";
  $("gameScreen").style.display = "none";
  $("overlay").style.display = "none";
  var b;
  b = getBest("mul");   $("bestMul").textContent   = b ? "さいこう " + b + " てん" : "";
  b = getBest("div");   $("bestDiv").textContent   = b ? "さいこう " + b + " てん" : "";
  b = getBest("kanji"); $("bestKanji").textContent = b ? "さいこう " + b + " てん" : "";
  b = getBest("geo");   $("bestGeo").textContent   = b ? "さいこう " + b + " てん" : "";
  b = getBest("en");    $("bestEn").textContent    = b ? "さいこう " + b + " てん" : "";
  b = getBest("hist");  $("bestHist").textContent  = b ? "さいこう " + b + " てん" : "";
  // スコアが なにも ないときは リセットボタンを かくす
  disarmResetBtn();
  var anyBest = false;
  for (var k in MODES) { if (getBest(k)) anyBest = true; }
  $("btnResetScore").style.display = anyBest ? "block" : "none";
}

/* スコアリセット (まちがえて おさないように 2かい おして かくてい) */
var resetArmTimer = null;
function disarmResetBtn() {
  clearTimeout(resetArmTimer);
  var btn = $("btnResetScore");
  btn.classList.remove("arm");
  btn.textContent = "🗑 スコアを リセット";
}
function onResetScore() {
  ensureAudio();
  SFX.tap();
  var btn = $("btnResetScore");
  if (!btn.classList.contains("arm")) {
    btn.classList.add("arm");
    btn.textContent = "ほんとうに リセットする?";
    resetArmTimer = setTimeout(disarmResetBtn, 3000);
    return;
  }
  try {
    for (var k in MODES) localStorage.removeItem(MODES[k].storageKey);
  } catch (e) {}
  showTitle();
}

  SFX.tap();
  state = {
    mode: mode,
    ended: false,
    score: 0,
    combo: 0,
    maxCombo: 0,
    kills: 0,
    playerHp: 100,
    playerMaxHp: 100,

    lastQuestionKey: ""
  };
  kanjiDeck = [];
  kanjiDeckTier = -1;
  geoDeck = [];
  geoDeckTier = -1;
  symbolDeck = [];
  symbolDeckTier = -1;

function updateHud() {
  $("scoreLabel").textContent = "スコア " + state.score;
  $("levelLabel").textContent = "レベル " + (state.monsterIndex + 1);
  var c = $("comboLabel");
  if (state.combo >= 2) {
    c.textContent = "🔥 " + state.combo + " コンボ!";
    c.classList.remove("hot");
    void c.offsetWidth;
    c.classList.add("hot");
  } else {
    c.textContent = "";
  }
}

function updatePlayerHp() {
  var pct = Math.max(0, state.playerHp / state.playerMaxHp * 100);
  $("playerHpBar").style.width = pct + "%";
  $("playerHpText").textContent = "きみの HP " + Math.max(0, state.playerHp) + "/" + state.playerMaxHp;
  $("playerFace").textContent = pct > 60 ? "🧒" : (pct > 30 ? "😰" : "😱");
}

function updateMonsterHp() {
  var pct = Math.max(0, state.monsterHp / state.monsterMaxHp * 100);
  $("monsterHpBar").style.width = pct + "%";
}

/* ==================== モンスター ==================== */
function spawnMonster() {
  var idx = state.monsterIndex;
  var mon = MONSTERS[Math.min(idx, MONSTERS.length - 1)];
  // レベル10いこうは ボーナスつきで つよくなる (いぜんの ★2 と おなじ バランス)
  state.monsterMaxHp = 30 + idx * 14 + (idx >= 9 ? 60 : 0);
  state.monsterHp = state.monsterMaxHp;
  state.monsterAttack = Math.min(35, 9 + idx * 2 + (idx >= 9 ? 8 : 0));

  $("monsterName").textContent = mon.name;

  // がぞうがあれば つかう (monster01.webp など)。なければ えもじ。
  var img = $("monsterImg");
  var emo = $("monsterEmoji");
  emo.textContent = mon.emoji;
  emo.style.display = "block";
  img.style.display = "none";
  img.onload = function() { img.style.display = "block"; emo.style.display = "none"; };
  img.onerror = function() { img.style.display = "none"; emo.style.display = "block"; };
  var n = idx + 1;
  img.src = "monster" + (n < 10 ? "0" + n : n) + ".webp";

  var box = $("monsterBox");
  box.classList.remove("defeated", "shake", "attack", "appear");
  void box.offsetWidth;
  box.classList.add("appear");
  updateMonsterHp();
  updateHud();
}

function popDamage(text, color) {
  var el = document.createElement("div");
  el.className = "dmgPop";
  el.textContent = text;
  if (color) el.style.color = color;
  $("monsterArea").appendChild(el);

}

/* ==================== もんだいづくり ==================== */
function makeQuestion() {
  if (state.mode === "mul") return makeMulQuestion();
  if (state.mode === "div") return makeDivQuestion();
  if (state.mode === "geo") return makeGeoQuestion();
  if (state.mode === "en") return makeEnglishQuestion();
  if (state.mode === "hist") return makeHistoryQuestion();
  return makeKanjiQuestion();
}

function makeMulQuestion() {
  var d = difficulty();
  // さいこう難度では ときどき 文しょうだい
  if (d === 2 && Math.random() < 0.35) return makeTextQuestion("mul");
  var a, b, key;
  do {
    if (d === 0) {
      // 九九ぜんぶ
      a = 1 + rand(9); b = 1 + rand(9);
    } else if (rand(2) === 0) {
      // むずかしい九九 (4〜9のだん)
      a = 4 + rand(6); b = 4 + rand(6);
    } else {
      // 2けた × 1けた
      a = 11 + rand(d === 2 ? 39 : 19); b = 2 + rand(8);
    }
    key = a + "x" + b;
  } while (key === state.lastQuestionKey);
  state.lastQuestionKey = key;
  var ans = a * b;
  var wrongs = collectWrongNumbers(ans, [
    a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b,
    ans + a, ans - a, ans + 1, ans - 1, ans + 2, ans + 10
  ]);
  return {
    label: "けいさん しよう!",
    main: a + " × " + b + " = ?",
    big: false,
    answer: String(ans),
    choices: shuffle([String(ans), wrongs[0], wrongs[1], wrongs[2]])
  };
}

function makeDivQuestion() {
  var d = difficulty();
  // さいこう難度では ときどき 文しょうだい
  if (d === 2 && Math.random() < 0.35) return makeTextQuestion("div");
  var a, b, key;
  do {
    if (d === 0) {
      a = 1 + rand(9); b = 1 + rand(9);
    } else if (rand(2) === 0) {
      // 九九のはんい (わる数も こたえも 4いじょう)
      a = 4 + rand(6); b = 4 + rand(6);
    } else {
      // 2けた ÷ 1けた (こたえも 2けた、わられる数は 99まで)
      a = 2 + rand(8);
      b = 10 + rand(Math.floor(99 / a) - 9);
    }
    key = (a * b) + "/" + a;
  } while (key === state.lastQuestionKey);
  state.lastQuestionKey = key;
  var ans = b; // (a*b) ÷ a = b
  var wrongs = collectWrongNumbers(ans, [
    ans + 1, ans - 1, ans + 2, ans - 2, ans + 3, ans - 3, ans + 4, 10 - ans
  ]);
  return {
    label: "けいさん しよう!",
    main: (a * b) + " ÷ " + a + " = ?",
    big: false,
    answer: String(ans),
    choices: shuffle([String(ans), wrongs[0], wrongs[1], wrongs[2]])
  };
}

/* さいこう難度で ランダムに でる 文しょうだい */
var TEXT_MUL = [
  function(a, b) { return "1はこに あめが " + a + "こずつ はいっています。" + b + "はこでは ぜんぶで なんこ?"; },
  function(a, b) { return "1だいに " + a + "にん のれる くるまが " + b + "だい あります。ぜんぶで なんにん のれる?"; },
  function(a, b) { return "1こ " + a + "えんの ガムを " + b + "こ かいます。ぜんぶで なんえん?"; },
  function(a, b) { return "1チーム " + a + "にんで " + b + "チーム つくります。みんなで なんにん?"; }
];
var TEXT_DIV = [
  function(a, b) { return (a * b) + "この いちごを " + a + "にんで おなじ かずずつ わけます。1人ぶんは なんこ?"; },
  function(a, b) { return (a * b) + "ページの ほんを 1日に " + a + "ページずつ よみます。なん日で よみおわる?"; },
  function(a, b) { return (a * b) + "えん もっています。1こ " + a + "えんの おかしは なんこ かえる?"; },
  function(a, b) { return (a * b) + "cmの リボンを " + a + "cmずつ きります。なん本に わけられる?"; }
];
function makeTextQuestion(kind) {
  var list = kind === "mul" ? TEXT_MUL : TEXT_DIV;
  var a, b, t, key;
  do {
    a = 2 + rand(8); b = 2 + rand(8);
    t = rand(list.length);
    key = kind + "T" + t + ":" + a + "," + b;
  } while (key === state.lastQuestionKey);
  state.lastQuestionKey = key;
  var ans = kind === "mul" ? a * b : b;
  var wrongs = collectWrongNumbers(ans, kind === "mul"
    ? [a * (b + 1), a * (b - 1), ans + a, ans - a, ans + 1, ans - 1]
    : [ans + 1, ans - 1, ans + 2, ans - 2, a, a + b]);
  return {
    label: "ぶんしょうだい だ!",
    main: list[t](a, b),
    big: false,
    text: true,
    answer: String(ans),
    choices: shuffle([String(ans), wrongs[0], wrongs[1], wrongs[2]])
  };
}

function collectWrongNumbers(ans, candidates) {
  var out = [];
  var used = { };
  used[ans] = true;
  var i, v;
  for (i = 0; i < candidates.length && out.length < 3; i++) {
    v = candidates[i];
    if (v >= 1 && !used[v]) { used[v] = true; out.push(String(v)); }
  }
  while (out.length < 3) {
    v = ans + (rand(19) - 9);
    if (v >= 1 && !used[v]) { used[v] = true; out.push(String(v)); }
  }
  return shuffle(out);
}

function makeKanjiQuestion() {
  // レベルが あがると 小2 → 小3 → 小3+小4 の かんじに かわる
  // (さいこう難度は 小3と小4を まぜて プールを ひろくする)
  var d = difficulty();
  if (kanjiDeck.length === 0 || kanjiDeckTier !== d) {
    kanjiPool = d === 2 ? KANJI_G3.concat(KANJI_G4) :
                d === 1 ? KANJI_G3.slice() :
                          KANJI_G2.slice();
    kanjiDeck = shuffle(kanjiPool.slice());
    kanjiDeckTier = d;
  }
  var item = kanjiDeck.pop();
  // よみ→かんじ の ぎゃくもんだいも 半分の かくりつで だす。
  // ただし 送り仮名が そろわず もんだいに ならない ときは かんじ→よみ に する。
  if (rand(2) === 0) {
    var rev = makeReadingToKanjiQuestion(item);
    if (rev) return rev;
  }
  return {
    label: "この かんじの よみかたは?",
    main: item[0],
    big: true,
    answer: item[1],
    choices: shuffle([item[1], item[2][0], item[2][1], item[2][2]])
  };
}

/* ことばの おわりの ひらがな (送り仮名)。かんじだけの ことばは "" */
function okurigana(word) {
  var m = word.match(/[ぁ-ゟ]+$/);
  return m ? m[0] : "";
}

function makeReadingToKanjiQuestion(item) {
  // まちがい候補は おなじプールの べつの かんじから えらぶ。
  // おなじ よみの かんじ (例: 街/町 = まち) は 正解が 2つに なるので のぞく。
  // 送り仮名は ぴったり おなじ ものだけ にする。「とぶ」の せんたくしに
  // 「飛ぶ」しか 〜ぶ が ない と、かんじを 見なくても こたえが わかってしまう。
  var oku = okurigana(item[0]);
  var others = kanjiPool.filter(function(e) {
    return e[0] !== item[0] && e[1] !== item[1] && okurigana(e[0]) === oku;
  });
  // おなじ 送り仮名の なかまが 3つ そろわない ときは このもんだいは 作らない
  if (others.length < 3) return null;
  // 文字数が おなじものを ゆうせん (見た目で わからないように)
  var sameLen = others.filter(function(e) { return e[0].length === item[0].length; });
  var pool = sameLen.length >= 3 ? sameLen : others;
  var wrongs = shuffle(pool.slice()).slice(0, 3).map(function(e) { return e[0]; });
  return {
    label: "この よみかたの かんじは?",
    main: item[1],
    big: item[1].length <= 4,
    answer: item[0],
    choices: shuffle([item[0], wrongs[0], wrongs[1], wrongs[2]])
  };
}

function ensureGeoPool() {
  // レベルが あがると なじみの あるものだけ → ぜんこくの とどうふけんに かわる
  var d = difficulty();
  if (geoDeck.length === 0 || geoDeckTier !== d) {
    geoPool = d === 2 ? GEO_MED.concat(GEO_HARD) :
              d === 1 ? GEO_MED.slice() :
                        GEO_EASY.slice();
    geoDeck = shuffle(geoPool.slice());
    geoDeckTier = d;
  }
}

function makeGeoQuestion() {
  ensureGeoPool();
  // とどうふけん・けんちょうしょざいちを メインに、地方/地図記号/せかいの国/日本一/名産も まぜて だす
  var roll = rand(100);
  if (roll < 15) return makeRegionQuestion();
  if (roll < 30) return makeSymbolQuestion();
  if (roll < 45) return makeCountryQuestion();
  if (roll < 60) return makeGeoRankQuestion();
  if (roll < 75) return makeProduceQuestion();
  return makeGeoPrefQuestion();
}

/* 「信濃川（長野県〜新潟県）」のように なまえと ばしょを ならべる せんたくし。
   ばしょの 県名・地方名にも ルビを ふる */
function placeHtml(place) {
  return place.replace(/[^〜・]+/g, function(p) {
    var k = PREF_KANA[p] || GEO_REGION_KANA[p];
    return k ? rubyHtml(p, k) : p;
  });
}
function namePlaceHtml(name, kana, place) {
  return rubyHtml(name, kana) + '<span class="placeTag">(' + placeHtml(place) + ')</span>';
}

/* 日本一・ランキング・はしっこの島・日本三大 の もんだいの 山を つくる。
   レベル1〜8 は「いちばん」だけ、9いこうは「2ばんめ・3ばんめ」を 出す。
   日本三景 などは レベル7いこう。 */
function buildRankDeck(d) {
  var specs = [];
  GEO_RANK.forEach(function(t, ti) {
    if (d < 2) specs.push({ kind: "rank", t: ti, r: 0 });
    else if (t.maxRank === 1) specs.push({ kind: "rank", t: ti, r: 0 });
    else for (var r = 1; r < t.maxRank; r++) specs.push({ kind: "rank", t: ti, r: r });
  });
  GEO_ISLANDS.forEach(function(x, i) { specs.push({ kind: "island", i: i }); });
  if (d >= 1) {
    GEO_SETS.forEach(function(s, si) {
      s.members.forEach(function(m, mi) { specs.push({ kind: "set", s: si, m: mi }); });
    });
  }
  return shuffle(specs);
}

function makeGeoRankQuestion() {
  var d = difficulty();
  if (rankDeck.length === 0 || rankDeckTier !== d) {
    rankDeck = buildRankDeck(d);
    rankDeckTier = d;
  }
  var sp = rankDeck.pop();
  if (sp.kind === "island") return makeIslandQuestion(sp.i);
  if (sp.kind === "set") return makeSetQuestion(sp.s, sp.m);

  var t = GEO_RANK[sp.t];
  var rankWord = sp.r === 0 ? "いちばん" : (sp.r + 1) + "ばんめに";
  var main = rubyText("日本で " + rankWord + " " + t.what + "は?");
  var opts = shuffle(t.items.slice());
  var ans = t.items[sp.r];
  if (t.pref) {
    return {
      label: "ランキング クイズ!",
      main: main, mainHtml: true, text: true, rubyBlock: true,
      answer: ans[0],
      answerLabel: ans[0] + " (" + PREF_KANA[ans[0]] + ")",
      choices: opts.map(function(e) { return e[0]; }),
      choicesHtml: opts.map(function(e) { return rubyHtml(e[0], PREF_KANA[e[0]]); })
    };
  }
  return {
    label: "ランキング クイズ!",
    main: main, mainHtml: true, text: true, rubyBlock: true,
    oneCol: true,
    answer: ans[0],
    answerLabel: ans[0] + "(" + ans[2] + ")",
    choices: opts.map(function(e) { return e[0]; }),
    choicesHtml: opts.map(function(e) { return namePlaceHtml(e[0], e[1], e[2]); })
  };
}

function makeIslandQuestion(i) {
  var isl = GEO_ISLANDS[i];
  var opts = shuffle(GEO_ISLANDS.slice());
  return {
    label: "はしっこの 島 クイズ!",
    main: rubyText("日本の いちばん " + isl[0] + "に ある 島は?"),
    mainHtml: true, text: true, rubyBlock: true,
    oneCol: true,
    answer: isl[1],
    answerLabel: isl[1] + "(" + isl[3] + ")",
    choices: opts.map(function(e) { return e[1]; }),
    choicesHtml: opts.map(function(e) { return namePlaceHtml(e[1], e[2], e[3]); })
  };
}

function makeSetQuestion(si, mi) {
  var s = GEO_SETS[si];
  var ans = s.members[mi];
  var opts = shuffle([ans].concat(s.decoys));
  return {
    label: "日本三大 クイズ!",
    main: rubyText(s.name + "の ひとつは どれ?"),
    mainHtml: true, text: true, rubyBlock: true,
    oneCol: true,
    answer: ans[0],
    answerLabel: ans[0] + "(" + ans[2] + ")",
    choices: opts.map(function(e) { return e[0]; }),
    choicesHtml: opts.map(function(e) { return namePlaceHtml(e[0], e[1], e[2]); })
  };
}

/* 名産: 生産量が いちばん 多い 都道府県 */
function makeProduceQuestion() {
  if (produceDeck.length === 0) produceDeck = shuffle(GEO_PRODUCE.slice());
  var item = produceDeck.pop();
  var opts = shuffle([item[2]].concat(item[3]));
  return {
    label: "名産 クイズ!",
    main: item[0] + " " + rubyText(item[1]),
    mainHtml: true, text: true, rubyBlock: true,
    answer: item[2],
    answerLabel: item[2] + " (" + PREF_KANA[item[2]] + ")",
    choices: opts,
    choicesHtml: opts.map(function(p) { return rubyHtml(p, PREF_KANA[p]); })
  };
}

function makeGeoPrefQuestion() {
  var item = geoDeck.pop();
  // とどうふけん→けんちょうしょざいち と ぎゃく(けんちょうしょざいち→とどうふけん)を 半分ずつ だす
  if (rand(2) === 0) return makeCapitalToPrefQuestion(item);
  return makePrefToCapitalQuestion(item);
}

var lastRegionPref = "";
function makeRegionQuestion() {
  var item;
  do {
    item = geoPool[rand(geoPool.length)];
  } while (item[0] === lastRegionPref && geoPool.length > 1);
  lastRegionPref = item[0];
  var correct = item[2];
  var wrongs = shuffle(GEO_REGIONS.filter(function(r) { return r !== correct; })).slice(0, 3);
  var opts = shuffle([correct, wrongs[0], wrongs[1], wrongs[2]]);
  return {
    label: "何地方の とどうふけんかな?",
    main: rubyHtml(item[0], item[3]),
    mainHtml: true,
    answer: correct,
    answerLabel: correct + " (" + GEO_REGION_KANA[correct] + ")",
    choices: opts,
    choicesHtml: opts.map(function(r) { return rubyHtml(r, GEO_REGION_KANA[r]); })
  };
}

function makeSymbolQuestion() {
  var d = difficulty();
  if (symbolDeck.length === 0 || symbolDeckTier !== d) {
    symbolPool = d === 2 ? SYM_MED.concat(SYM_HARD) :
                 d === 1 ? SYM_MED.slice() :
                           SYM_EASY.slice();
    symbolDeck = shuffle(symbolPool.slice());
    symbolDeckTier = d;
  }
  var item = symbolDeck.pop();
  var others = shuffle(symbolPool.filter(function(e) { return e !== item; })).slice(0, 3);
  var opts = shuffle([item].concat(others));
  return {
    label: "この ちずきごうは なに?",
    main: item.html,
    big: false,
    symbol: true,
    answer: item.name,
    answerLabel: item.name + " (" + item.kana + ")",
    choices: opts.map(function(e) { return e.name; }),
    choicesHtml: opts.map(function(e) { return rubyHtml(e.name, e.kana); })
  };
}

function makeCountryQuestion() {
  var d = difficulty();
  if (countryDeck.length === 0 || countryDeckTier !== d) {
    countryPool = d === 2 ? COUNTRY_MED.concat(COUNTRY_HARD) :
                  d === 1 ? COUNTRY_MED.slice() :
                            COUNTRY_EASY.slice();
    countryDeck = shuffle(countryPool.slice());
    countryDeckTier = d;
  }
  var item = countryDeck.pop();
  var others = shuffle(countryPool.filter(function(e) { return e !== item; })).slice(0, 3);
  var opts = shuffle([item].concat(others));
  return {
    label: "この ヒントの 国は どこ?",
    main: rubyText(item[1]),
    mainHtml: true,
    big: false,
    text: true,
    rubyBlock: true,
    answer: item[0],
    answerLabel: item[2] ? item[0] + " (" + item[2] + ")" : item[0],
    choices: opts.map(function(e) { return e[0]; }),
    choicesHtml: opts.map(function(e) { return rubyHtml(e[0], e[2]); })
  };
}

function makePrefToCapitalQuestion(item) {
  // field 1 = けんちょうしょざいち、よみは そのつぎ (index 4)
  return makeGeoPairQuestion(item, 1, "けんちょうしょざいちは どこ?");
}

function makeCapitalToPrefQuestion(item) {
  // field 0 = とどうふけん、よみは index 3
  return makeGeoPairQuestion(item, 0, "どの とどうふけんの けんちょうしょざいちかな?");
}

/* とどうふけん⇔けんちょうしょざいち の もんだいを つくる。
   field = こたえる ほうの index (0 か 1)。よみは field + 3 に ある。 */
function makeGeoPairQuestion(item, field, label) {
  var qField = field === 0 ? 1 : 0;   // もんだいに だす ほう
  var wrongs = pickGeoDistractors(item, field);
  // 県庁所在地を こたえる もんだいでは「滋賀県 → 滋賀市」のような ひっかけを 1つ まぜる
  if (field === 1) {
    var fake = fakeCapital(item);
    if (fake) wrongs[2] = fake;
  }
  var opts = shuffle([item].concat(wrongs));
  return {
    label: label,
    main: rubyHtml(item[qField], item[qField + 3]),
    mainHtml: true,
    answer: item[field],
    answerLabel: item[field] + " (" + item[field + 3] + ")",
    choices: opts.map(function(e) { return e[field]; }),
    choicesHtml: opts.map(function(e) { return rubyHtml(e[field], e[field + 3]); })
  };
}

/* 県の なまえに「市」を つけた ひっかけ (滋賀県 → 滋賀市、埼玉県 → 埼玉市)。
   県庁所在地が もともと 県と おなじ なまえ (青森県 → 青森市) なら 作らない。
   栃木市・山梨市・沖縄市 のように 実在するが 県庁所在地では ない 市も ふくまれる */
function fakeCapital(item) {
  if (item[0] === "北海道" || item[0] === "東京都") return null;
  var name = item[0].replace(/[県府都]$/, "") + "市";
  if (name === item[1]) return null;
  var kana = item[3].replace(/(けん|ふ|と)$/, "") + "し";
  return [item[0], name, item[2], item[3], kana];
}

function pickGeoDistractors(item, field) {
  var others = geoPool.filter(function(e) {
    if (e === item) return false;
    // 「東京」だけ「市」が つかず 見た目が うくので、こたえが 東京の ときだけ こうほに する
    if (field === 1 && e[1] === "東京" && item[1] !== "東京") return false;
    return true;
  });
  var target = item[field];
  var sameLen = others.filter(function(e) { return e[field].length === target.length; });
  var pool = sameLen.length >= 3 ? sameLen : others;
  return shuffle(pool.slice()).slice(0, 3);
}

/* ==================== えいご ==================== */
function enWordHtml(word, kana) {
  return '<span class="enWord"><span class="enMain">' + word +
    '</span><span class="enKana">' + kana + '</span></span>';
}
// いみ(日本語)を メインに、下に えいご + カタカナよみを そえる せんたくし
function enMeaningHtml(ja, word, kana) {
  return '<span class="enWord"><span class="enMain enMainJa">' + ja +
    '</span><span class="enKana">' + word + ' / ' + kana + '</span></span>';
}

function makeEnglishQuestion() {
  var d = difficulty();
  if (enDeck.length === 0 || enDeckTier !== d) {
    enPool = d === 2 ? EN_MED.concat(EN_HARD) :
             d === 1 ? EN_MED.slice() :
                       EN_EASY.slice();
    enDeck = shuffle(enPool.slice());
    enDeckTier = d;
  }
  var item = enDeck.pop();
  // えいご→いみ と いみ→えいご を 半分ずつ だす
  if (rand(2) === 0) return makeMeaningToEnQuestion(item);
  return makeEnToMeaningQuestion(item);
}

function makeEnToMeaningQuestion(item) {
  // item = [えいご, カタカナ, いみ, [まちがい1,2,3]]
  // もんだいちゅうは いみ(日本語)だけを みせ、こたえた あとに 全せんたくしへ
  // えいご+カタカナよみを だす (先に みえると こたえが わかってしまうため)。
  // そのため まちがいも えいご・よみを もつ プールの ほかの語から えらぶ。
  var others = shuffle(enPool.filter(function(e) {
    return e[0] !== item[0] && e[2] !== item[2];
  })).slice(0, 3);
  var opts = [item].concat(others).map(function(e) {
    return { val: e[2], html: enMeaningHtml(e[2], e[0], e[1]) };
  });
  opts = shuffle(opts);
  return {
    label: "この えいごの いみは?",
    main: enWordHtml(item[0], item[1]),
    mainHtml: true,
    enQ: true,
    answer: item[2],
    answerLabel: item[2] + " (" + item[0] + " / " + item[1] + ")",
    choices: opts.map(function(o) { return o.val; }),
    choicesHtml: opts.map(function(o) { return o.html; }),
    // よみの行は 場所だけ とっておき、こたえた あとに 見えるようにする
    hideReadingUntilAnswer: true
  };
}

function makeMeaningToEnQuestion(item) {
  // いみ(日本語)を みせて えいごを えらばせる。せんたくしには カタカナよみを つける。
  var others = shuffle(enPool.filter(function(e) {
    return e[0] !== item[0] && e[2] !== item[2];
  })).slice(0, 3);
  var opts = [item].concat(others).map(function(e) {
    return { val: e[0], html: enWordHtml(e[0], e[1]) };
  });
  opts = shuffle(opts);
  return {
    label: "「" + item[2] + "」を えいごで?",
    main: item[2],
    big: item[2].length <= 5,
    answer: item[0],
    answerLabel: item[0] + " (" + item[1] + ")",
    choices: opts.map(function(o) { return o.val; }),
    choicesHtml: opts.map(function(o) { return o.html; })
  };
}

/* ==================== 日本史 ==================== */
function ensureHistPools() {
  var d = difficulty();
  if (histDeck.length === 0 || histDeckTier !== d) {
    histPool = d === 2 ? HIST_MED.concat(HIST_HARD) :
               d === 1 ? HIST_MED.slice() :
                         HIST_EASY.slice();
    histDeck = shuffle(histPool.slice());
    histDeckTier = d;
  }
  if (histEventDeck.length === 0 || histEventDeckTier !== d) {
    histEventPool = d === 2 ? HIST_EVENT_MED.concat(HIST_EVENT_HARD) :
                    d === 1 ? HIST_EVENT_MED.slice() :
                              HIST_EVENT_EASY.slice();
    histEventDeck = shuffle(histEventPool.slice());
    histEventDeckTier = d;
  }
}

function makeHistoryQuestion() {
  ensureHistPools();
  var roll = rand(100);
  if (roll < 30) return makeHistPersonQuestion();  // ヒント → 人ぶつ
  if (roll < 70) return makeHistYearQuestion();    // できごと → なん年
  if (roll < 85) return makeEraRangeQuestion();    // 年の はんい → じだい
  return makeEraOrderQuestion();                   // じだいの じゅんばん
}

/* 「なん年から なん年までは なに時代?」 */
function makeEraRangeQuestion() {
  if (eraRangeDeck.length === 0) eraRangeDeck = shuffle(ERA_RANGE.slice());
  var item = eraRangeDeck.pop();
  var wrongs = shuffle(ERAS.filter(function(e) { return e[0] !== item[0]; }))
    .slice(0, 3).map(function(e) { return e[0]; });
  var opts = shuffle([item[0], wrongs[0], wrongs[1], wrongs[2]]);
  return {
    label: "この きかんは なに時代?",
    main: item[1] + "年 〜 " + item[2] + "年",
    answer: item[0],
    answerLabel: item[0] + " (" + ERA_KANA[item[0]] + ")",
    choices: opts,
    choicesHtml: opts.map(function(e) { return rubyHtml(e, ERA_KANA[e]); })
  };
}

/* ヒントの せつめいから 人ぶつを あてる */
function makeHistPersonQuestion() {
  var item = histDeck.pop();
  var others = shuffle(histPool.filter(function(e) { return e !== item; })).slice(0, 3);
  var opts = shuffle([item].concat(others));
  return {
    label: "この せつめいの ひとは だれ?",
    main: rubyText(item[2]),
    mainHtml: true,
    text: true,
    rubyBlock: true,
    answer: item[0],
    answerLabel: item[1] ? item[0] + " (" + item[1] + ")" : item[0],
    choices: opts.map(function(e) { return e[0]; }),
    choicesHtml: opts.map(function(e) { return rubyHtml(e[0], e[1]); })
  };
}

/* できごとが おこった 年を あてる。
   デッキ(シャッフルした山)から 1つずつ ひくので、ひとまわりする まで
   おなじ もんだいは 出ない。 */
function makeHistYearQuestion() {
  var item = histEventDeck.pop();
  // まちがいは 近い年から えらぶ (かんたんな レベルほど はなれた年に する)
  var near = difficulty() === 0 ? 10 : 6;
  var cand = HIST_ALL_YEARS.filter(function(y) { return y !== item[1]; })
    .sort(function(a, b) { return Math.abs(a - item[1]) - Math.abs(b - item[1]); })
    .slice(0, near);
  var wrongs = shuffle(cand).slice(0, 3);
  var opts = shuffle([item[1]].concat(wrongs)).map(function(y) { return y + "年"; });
  return {
    label: "この できごとが おこったのは なん年?",
    main: rubyText(item[0]),
    mainHtml: true,
    text: true,
    rubyBlock: true,
    answer: item[1] + "年",
    choices: opts
  };
}

/* 4つの じだいから いちばん 古い/あたらしい ものを えらぶ */
function makeEraOrderQuestion() {
  var picked = shuffle(ERAS.slice()).slice(0, 4);
  var oldest = rand(2) === 0;
  var sorted = picked.slice().sort(function(a, b) { return ERA_ORDER[a[0]] - ERA_ORDER[b[0]]; });
  var correct = (oldest ? sorted[0] : sorted[3])[0];
  var opts = shuffle(picked.map(function(e) { return e[0]; }));
  return {
    label: oldest ? "いちばん ふるい じだいは どれ?" : "いちばん あたらしい じだいは どれ?",
    main: oldest ? "⏳" : "⏩",
    answer: correct,
    answerLabel: correct + " (" + ERA_KANA[correct] + ")",
    choices: opts,
    choicesHtml: opts.map(function(e) { return rubyHtml(e, ERA_KANA[e]); })
  };
}

/* ==================== しゅつだい・かいとう ==================== */
var currentQ = null;

function nextQuestion() {
  currentQ = makeQuestion();
  $("questionLabel").textContent = currentQ.label;
  var qm = $("questionMain");
  qm.classList.toggle("kanjiBig", !!currentQ.big);
  qm.classList.toggle("textQ", !!currentQ.text);
  qm.classList.toggle("symbolQ", !!currentQ.symbol);
  qm.classList.toggle("enQ", !!currentQ.enQ);
  qm.classList.toggle("rubyBlock", !!currentQ.rubyBlock);
  $("choices").classList.toggle("oneCol", !!currentQ.oneCol);
  if (currentQ.symbol || currentQ.mainHtml) {
    qm.innerHTML = currentQ.main;
  } else {
    qm.textContent = currentQ.main;
  }
  $("message").textContent = "";
  $("message").className = "";
  for (var i = 0; i < 4; i++) {
    var b = choiceBtns[i];
    b.className = "choiceBtn";
    // よみを こたえた あとに だす もんだいでは、いまは よみを かくしておく
    // (行の 場所は とっておくので レイアウトは うごかない)
    if (currentQ.hideReadingUntilAnswer) b.classList.add("hideReading");
    b.disabled = false;
    // dataset.val に せいかいはんてい用の あたいを もつ (フリガナ付き表示でも マッチできるように)
    b.setAttribute("data-val", currentQ.choices[i]);
    if (currentQ.choicesHtml) {
      b.innerHTML = currentQ.choicesHtml[i];
    } else {
      b.textContent = currentQ.choices[i];
    }
  }
  busy = false;
}

function answer(idx) {
  if (busy || !currentQ) return;
  busy = true;
  ensureAudio();
  var picked = choiceBtns[idx].getAttribute("data-val");
  var isCorrect = picked === currentQ.answer;

  choiceBtns.forEach(function(b) { b.disabled = true; });

  // こたえた あとに よみを だす もんだい (えいご→いみ) では、ここで かくしていた
  // よみ (えいご+カタカナ) を 全せんたくしに 見えるようにする。
  if (currentQ.hideReadingUntilAnswer) {
    choiceBtns.forEach(function(b) { b.classList.remove("hideReading"); });
  }

  if (isCorrect) {
    choiceBtns[idx].classList.add("correct");
    onCorrect();
  } else {
    choiceBtns[idx].classList.add("wrong");
    // せいかいのボタンを ひからせる
    choiceBtns.forEach(function(b) {
      if (b.getAttribute("data-val") === currentQ.answer) b.classList.add("correct");
    });
    onWrong();
  }
}

function onCorrect() {
  SFX.correct();
  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  var dmg = 10 + Math.min(state.combo, 10) * 2;
  var crit = state.combo > 0 && state.combo % 5 === 0;
  if (crit) dmg = Math.floor(dmg * 1.5);
  state.monsterHp -= dmg;
  state.score += 100 + Math.min(state.combo, 20) * 20;

  var msg = $("message");
  msg.textContent = crit ? "クリティカル! すごい!!" : ["せいかい!", "やったね!", "いいぞ!", "すごい!"][rand(4)];
  msg.className = "good";

  popDamage("-" + dmg, crit ? "#ff80ab" : null);
  var box = $("monsterBox");
  box.classList.remove("shake", "appear", "attack");
  void box.offsetWidth;
  box.classList.add("shake");

  updateMonsterHp();
  updateHud();

  if (state.monsterHp <= 0) {
    defeatMonster();
  } else {
    setTimeout(function() { if (!state.ended) nextQuestion(); }, 900);
  }
}

function onWrong() {
  SFX.wrong();
  state.combo = 0;

  var msg = $("message");
  msg.textContent = "おしい! こたえは「" + (currentQ.answerLabel || currentQ.answer) + "」だよ";
  msg.className = "bad";
  updateHud();

  // モンスターの こうげき
  setTimeout(function() {
    if (state.ended) return;
    SFX.hurt();
    var box = $("monsterBox");
    box.classList.remove("shake", "appear", "attack");
    void box.offsetWidth;
    box.classList.add("attack");
    var pa = $("playerArea");
    pa.classList.remove("hurt");
    void pa.offsetWidth;
    pa.classList.add("hurt");

    state.playerHp -= state.monsterAttack;
    updatePlayerHp();

    if (state.playerHp <= 0) {
      setTimeout(function() { if (!state.ended) gameOver(); }, 700);
    } else {
      setTimeout(function() { if (!state.ended) nextQuestion(); }, 1400);
    }
  }, 700);
}

function defeatMonster() {
  SFX.win();
  state.kills++;
  var bonus = 200 + state.monsterIndex * 50;
  state.score += bonus;

  var box = $("monsterBox");
  box.classList.remove("shake", "appear", "attack");
  void box.offsetWidth;
  box.classList.add("defeated");

  // ちょっと かいふく
  var heal = 15;
  state.playerHp = Math.min(state.playerMaxHp, state.playerHp + heal);
  updatePlayerHp();

  var banner = $("winBanner");
  banner.innerHTML = "モンスターを たおした!<br><span style='font-size:15px'>ボーナス +" + bonus + " / HP +" + heal + " かいふく</span>";
  banner.style.display = "block";
  updateHud();

  setTimeout(function() {
    banner.style.display = "none";
    if (state.ended) return;
    if (state.monsterIndex + 1 >= CLEAR_LEVEL) {
      gameClear();
      return;
    }
    state.monsterIndex++;
    spawnMonster();
    nextQuestion();
  }, 1600);
}

function gameOver() {
  SFX.lose();
  showResult("over");
}

function quitGame() {
  ensureAudio();
  SFX.tap();
  showResult("quit");
}

function gameClear() {
  SFX.win();
  showResult("clear");
}

function showResult(kind) {
  state.ended = true;
  $("overlayFace").textContent = kind === "clear" ? "🏆" : (kind === "quit" ? "😊" : "😵");
  var h = $("overlayTitle");
  h.textContent = kind === "clear" ? "🎉 ゲームクリア! 🎉" : (kind === "quit" ? "おつかれさま!" : "ゲームオーバー");
  h.style.color = kind === "over" ? "#ff8a80" : "#ffd54f";
  $("btnRetry").style.display = kind === "quit" ? "none" : "block";

  $("finalScore").textContent = state.score;
  $("finalKills").textContent = state.kills;
  $("finalCombo").textContent = state.maxCombo;

  var best = getBest(state.mode);
  var isNew = state.score > best;
  if (isNew) setBest(state.mode, state.score);
  $("newRecord").style.display = isNew && state.score > 0 ? "block" : "none";

  $("overlay").style.display = "flex";
}

/* ==================== イベント ==================== */
$("btnMul").addEventListener("click", function() { startGame("mul"); });
$("btnDiv").addEventListener("click", function() { startGame("div"); });
$("btnKanji").addEventListener("click", function() { startGame("kanji"); });
$("btnGeo").addEventListener("click", function() { startGame("geo"); });
$("btnEn").addEventListener("click", function() { startGame("en"); });
$("btnHist").addEventListener("click", function() { startGame("hist"); });
choiceBtns.forEach(function(btn, i) {
  btn.addEventListener("click", function() { answer(i); });
});
$("btnQuit").addEventListener("click", function() { quitGame(); });
$("btnResetScore").addEventListener("click", onResetScore);
$("btnRetry").addEventListener("click", function() { startGame(state.mode); });
$("btnToTitle").addEventListener("click", function() { ensureAudio(); SFX.tap(); showTitle(); });

showTitle();
</script>
